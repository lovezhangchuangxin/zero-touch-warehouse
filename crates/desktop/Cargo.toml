[package]
name = "ztw-desktop"
version = "0.1.0"
edition = "2024"

[lib]
name = "ztw_desktop"
path = "src/lib.rs"

[[bin]]
name = "ztw-desktop"
path = "src/main.rs"

[dependencies]
ztw-api = { path = "../api" }
ztw-model = { path = "../model" }
ztw-sim = { path = "../sim" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }

[build-dependencies]
tauri-build = { version = "2", features = [] }
