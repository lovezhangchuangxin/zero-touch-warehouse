[package]
name = "ztw-desktop"
version = "0.1.0"
edition = "2024"

[lib]
name = "ztw_desktop"
path = "src/lib.rs"

# Tauri 2 壳（main.rs）在 B2 提交 3 加入；lib 保持无 Tauri 依赖、可独立测试
# （docs/architecture/01：sim 与 api 不依赖 Tauri，desktop 负责组装）。

[dependencies]
ztw-api = { path = "../api" }
ztw-model = { path = "../model" }
ztw-sim = { path = "../sim" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
